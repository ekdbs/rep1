<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <canvas id = "myCanvas" width="600" height="400" style="border: 3px solid;"></canvas>
        <script>
            var ctx = document.getElementById("myCanvas");
            var myContext = ctx.getContext("2d");

            myContext.beginPath();
            myContext.moveTo(100, 20);
            myContext.lineTo(40, 120);
            myContext.lineTo(160, 120);
            myContext.fill();

            myContext.moveTo(300, 20);
            myContext.lineTo(200, 60);
            myContext.lineTo(200,120);
            myContext.lineTo(400, 120);
            myContext.lineTo(400, 60);
            myContext.closePath();
            myContext.stroke();

            myContext.beginPath();
            myContext.arc(100,250,50,0,2*Math.PI);
            myContext.closePath();
            myContext.stroke();
            myContext.beginPath();
            myContext.arc(300,250,80,0,1*Math.PI);
            // myContext.closePath();
            myContext.stroke();
        </script>
    </body>
</html>
