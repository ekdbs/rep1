<html>
    <head>
        <meta charset="utf-8">
        <script>
            var a = 5;
            var b = 3;
            var c = 3.0;
            
            if(a>0){
                document.write("a는 0보다 크다" + "<br>");
            }else{
                document.write("a는 0보다 작다" + "<br>");
            }
            
            if(a<b){
                document.write("a는 b보다 작다" + "<br>");
            }else if(a>b){
                document.write("a는 b보다 크다" + "<br>");
            }

            if(b==c){
                document.write("b와 c는 같다" + "<br>");
            }else{
                document.write("b와 c는 같지 않다" + "<br>");
            }
            document.write(typeof(b)+"<br>");
            document.write(typeof(c));
        </script>
    </head>
    <body></body>
</html>
