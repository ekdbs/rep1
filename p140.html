<html>
    <head>
        <meta charset="utf-8">
        <script>
            var score = 40;

            if(score >= 90 && score < 100){
                document.write("A");
            }else if(score >= 80 && score < 90){
                document.write("B");
            }else if(score >= 70 && score < 80){
                document.write("C");
            }else if(score >= 60 && score < 70){
                document.write("D")
            }else{
                document.write("F");
            }
            document.write("등급입니다.");
        </script>
    </head>
</html>
